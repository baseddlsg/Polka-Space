name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run frontend tests
      run: npm run test
    
    - name: Run frontend tests with coverage
      run: npm run test:coverage
    
    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
    
    - name: Run backend tests
      run: |
        cd backend
        npm test
      env:
        NODE_ENV: test
        REDIS_URL: redis://localhost:6379/1
        ASSETHUB_ENDPOINT_URL: wss://westmint-rpc.polkadot.io
        NFT_COLLECTION_ID: 1
        SERVER_ACCOUNT_SEED: //Alice
    
    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage

  integration-tests:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci
    
    - name: Build frontend
      run: npm run build:dev
    
    - name: Build backend
      run: |
        cd backend
        npm run build
    
    - name: Start backend server
      run: |
        cd backend
        npm start &
        sleep 10
      env:
        NODE_ENV: test
        PORT: 3001
        REDIS_URL: redis://localhost:6379/1
        ASSETHUB_ENDPOINT_URL: wss://westmint-rpc.polkadot.io
        NFT_COLLECTION_ID: 1
        SERVER_ACCOUNT_SEED: //Alice
    
    - name: Run integration tests
      run: npm run test -- --run integration
      env:
        VITE_API_URL: http://localhost:3001

  contract-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: wasm32-unknown-unknown
        override: true
        components: rustfmt, clippy
    
    - name: Install cargo-contract
      run: |
        cargo install --force --locked cargo-contract --version 2.0.0
    
    - name: Run contract tests
      run: |
        cd contracts/substrate/nft-portfolio
        cargo test
    
    - name: Build contract
      run: |
        cd contracts/substrate/nft-portfolio
        cargo contract build
    
    - name: Run contract integration tests
      run: |
        cd contracts/substrate/nft-portfolio
        chmod +x test.sh
        ./test.sh